{% load static %}
<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2545" />
  <meta name="description" content="{% block meta_description %}PharMap — Trouvez vos médicaments en temps réel au Gabon{% endblock %}" />
  <title>{% block title %}PharMap{% endblock %} — Médicaments en temps réel</title>

  <link rel="manifest" href="/static/pharmap/manifest.json" />
  <link rel="apple-touch-icon" href="/static/pharmap/images/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* ════════════════════════════════════════
       DESIGN TOKENS
    ════════════════════════════════════════ */
    :root {
      /* Palette principale - Vert, Blanc, Bleu vif */
      --blue:       #0066FF;
      --blue-2:     #0052CC;
      --blue-3:     #0040A0;
      --blue-light: #E6F0FF;
      --blue-bright:#3385FF;

      --green:      #00C853;
      --green-2:    #00A843;
      --green-3:    #008935;
      --green-light:#E8F5E9;
      --green-bright:#2ED573;

      --white:      #FFFFFF;
      --off-white:  #F8FAFC;
      --gray-50:    #F9FAFB;
      --gray-100:   #F3F4F6;
      --gray-200:   #E5E7EB;
      --gray-300:   #D1D5DB;
      --gray-400:   #9CA3AF;
      --gray-500:   #6B7280;
      --gray-600:   #4B5563;
      --gray-700:   #374151;
      --gray-800:   #1F2937;
      --gray-900:   #111827;

      --ink:        #0F172A;
      --ink-2:      #1E293B;
      --ink-3:      #475569;
      --ink-4:      #64748B;
      --ink-5:      #94A3B8;

      --line:       rgba(15,23,42,0.08);
      --line-2:     rgba(15,23,42,0.15);

      --sh-1: 0 1px 4px rgba(0,102,255,0.08), 0 1px 2px rgba(0,102,255,0.04);
      --sh-2: 0 4px 20px rgba(0,102,255,0.12), 0 2px 8px rgba(0,102,255,0.06);
      --sh-3: 0 12px 48px rgba(0,102,255,0.16), 0 4px 16px rgba(0,102,255,0.08);
      --sh-4: 0 24px 72px rgba(0,102,255,0.20), 0 8px 28px rgba(0,102,255,0.10);

      --r-xs: 6px;
      --r-sm: 10px;
      --r:    16px;
      --r-lg: 24px;
      --r-xl: 36px;

      --ease:   cubic-bezier(0.4,0,0.2,1);
      --spring: cubic-bezier(0.34,1.56,0.64,1);
      --t:      all 0.2s var(--ease);
    }

    /* ════════════════════════════════════════
       RESET & BASE
    ════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray-50);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ════════════════════════════════════════
       NAVBAR
    ════════════════════════════════════════ */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 64px;
      display: flex; align-items: center;
      padding: 0 40px;
      justify-content: space-between;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(28px) saturate(1.8);
      -webkit-backdrop-filter: blur(28px) saturate(1.8);
      border-bottom: 1px solid var(--line);
      transition: var(--t);
    }
    .navbar.scrolled {
      background: rgba(255,255,255,0.98);
      box-shadow: var(--sh-2);
    }

    .navbar-logo {
      display: flex; align-items: center; gap: 11px;
      text-decoration: none;
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(0,102,255,0.3);
      flex-shrink: 0;
      transition: var(--t);
    }
    .logo-mark svg,
    .logo-mark img { display: block; }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem; font-weight: 700;
      color: var(--blue); letter-spacing: -0.2px;
      transition: var(--t);
    }
    .logo-text em { color: var(--green); font-style: normal; }

    .navbar-nav {
      display: flex; align-items: center; gap: 2px;
      list-style: none;
    }
    .navbar-nav a {
      text-decoration: none; color: var(--ink-2);
      font-size: 0.85rem; font-weight: 500;
      font-family: 'Syne', sans-serif;
      padding: 6px 12px; border-radius: var(--r-xs);
      transition: var(--t); letter-spacing: 0.1px;
    }
    .navbar-nav a:hover  { color: var(--blue); background: var(--blue-light); }
    .navbar-nav a.active { color: var(--blue); background: var(--blue-light); font-weight: 600; }

    .navbar-actions { display: flex; align-items: center; gap: 8px; }

    /* ════════════════════════════════════════
       BOUTONS
    ════════════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 20px; border-radius: var(--r-sm);
      font-family: 'Syne', sans-serif; font-size: 0.845rem; font-weight: 600;
      cursor: pointer; border: none; text-decoration: none;
      transition: var(--t); letter-spacing: 0.2px; white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue), var(--blue-bright)); color: white;
      box-shadow: 0 2px 10px rgba(0,102,255,0.28);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--blue-2), var(--blue)); transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,102,255,0.34);
    }
    .btn-green {
      background: linear-gradient(135deg, var(--green), var(--green-bright)); color: white;
      box-shadow: 0 2px 10px rgba(0,200,83,0.28);
    }
    .btn-green:hover { 
      background: linear-gradient(135deg, var(--green-2), var(--green)); 
      transform: translateY(-1px); 
    }
    .btn-outline {
      background: transparent; color: var(--blue);
      border: 1.5px solid var(--blue-light);
    }
    .btn-outline:hover { background: var(--blue-light); border-color: var(--blue); }
    .btn-ghost { background: transparent; color: var(--ink-3); }
    .btn-ghost:hover { background: var(--gray-100); color: var(--blue); }
    .btn-sm  { padding: 7px 14px; font-size: 0.8rem; }
    .btn-lg  { padding: 14px 30px; font-size: 0.9rem; border-radius: var(--r); }
    .btn-xl  { padding: 17px 38px; font-size: 0.95rem; border-radius: var(--r); }

    /* ════════════════════════════════════════
       CARDS GÉNÉRIQUES
    ════════════════════════════════════════ */
    .card {
      background: white; border-radius: var(--r); box-shadow: var(--sh-1);
      border: 1px solid var(--line); transition: var(--t); overflow: hidden;
    }
    .card:hover { box-shadow: var(--sh-3); transform: translateY(-2px); }

    /* ════════════════════════════════════════
       BADGES
    ════════════════════════════════════════ */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px;
      font-family: 'Syne', sans-serif; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.3px; text-transform: uppercase;
    }
    .badge-green { background: var(--green-light); color: var(--green);  border: 1px solid var(--green-bright); }
    .badge-blue  { background: var(--blue-light);  color: var(--blue);   border: 1px solid var(--blue-bright); }
    .badge-gold  { background: #FEF3C7;  color: #D97706;   border: 1px solid #FCD34D; }
    .badge-red   { background: #FEF2F2;           color: #DC2626;       border: 1px solid #FCA5A5; }
    .badge-gray  { background: var(--gray-100);     color: var(--ink-4);  border: 1px solid var(--gray-200); }

    /* ════════════════════════════════════════
       FORMULAIRES
    ════════════════════════════════════════ */
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 0.78rem; font-weight: 600;
      font-family: 'Syne', sans-serif; color: var(--ink-3);
      margin-bottom: 7px; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .form-control {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--line-2); border-radius: var(--r-sm);
      font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--ink);
      outline: none; transition: var(--t); background: white;
    }
    .form-control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,102,255,0.12);
    }

    /* ════════════════════════════════════════
       SKELETON LOADER
    ════════════════════════════════════════ */
    .skeleton {
      background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--r-sm);
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ════════════════════════════════════════
       TOAST
    ════════════════════════════════════════ */
    .toast-container {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--ink); color: white;
      padding: 11px 20px; border-radius: var(--r-sm);
      font-size: 0.875rem; font-weight: 500;
      box-shadow: var(--sh-3);
      animation: toastIn 0.3s var(--spring);
      white-space: nowrap;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ════════════════════════════════════════
       NAVIGATION MOBILE (bottom nav)
    ════════════════════════════════════════ */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 900;
      background: white; border-top: 1px solid var(--line);
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
      box-shadow: 0 -4px 24px rgba(0,102,255,0.07);
    }
    .bottom-nav-items { display: flex; justify-content: space-around; }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 14px; text-decoration: none; color: var(--ink-5);
      font-family: 'Syne', sans-serif; font-size: 0.66rem; font-weight: 600;
      border-radius: var(--r-sm); transition: var(--t);
    }
    .bnav-pip {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 9px; transition: var(--t);
    }
    .bottom-nav-item.active            { color: var(--blue); }
    .bottom-nav-item.active .bnav-pip  { background: var(--blue-light); }
    .bottom-nav-item.active svg        { stroke: var(--blue); }

    /* ════════════════════════════════════════
       SPINNER
    ════════════════════════════════════════ */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ════════════════════════════════════════
       MODAL
    ════════════════════════════════════════ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(12,31,63,0.52);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @media (min-width: 768px) { .modal-overlay { align-items: center; } }

    .modal {
      background: white;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      width: 100%; max-width: 520px; max-height: 90vh;
      overflow-y: auto; padding: 32px 24px;
      animation: slideUp 0.32s var(--spring);
    }
    @media (min-width: 768px) {
      .modal { border-radius: var(--r-xl); padding: 44px; }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ════════════════════════════════════════
       FOOTER
    ════════════════════════════════════════ */
    .footer {
      background: var(--ink);
      color: rgba(255,255,255,0.48);
      padding: 80px 0 40px;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 52px; margin-bottom: 60px;
    }
    .footer-brand-name {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem; color: white; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px; font-weight: 400;
    }
    .footer-brand-desc {
      font-size: 0.875rem; line-height: 1.8;
      color: rgba(255,255,255,0.38);
    }
    .footer-col-title {
      font-family: 'Syne', sans-serif; font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.4px;
      color: rgba(255,255,255,0.88); margin-bottom: 20px;
    }
    .footer-links {
      list-style: none; display: flex; flex-direction: column; gap: 12px;
    }
    .footer-links a {
      color: rgba(255,255,255,0.4); text-decoration: none;
      font-size: 0.875rem; transition: var(--t);
    }
    .footer-links a:hover { color: rgba(255,255,255,0.8); }
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 30px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.8rem; color: rgba(255,255,255,0.25);
    }

    /* ════════════════════════════════════════
       UTILITAIRES COMMUNS
    ════════════════════════════════════════ */
    .container    { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
    .container-sm { max-width: 740px;  margin: 0 auto; padding: 0 32px; }
    .section      { padding: 96px 0; }
    .section-sm   { padding: 56px 0; }
    .page-content       { padding-top: 64px; min-height: 100vh; }
    .page-content-flush { min-height: 100vh; }

    .serif    { font-family: 'Fraunces', serif; }
    .serif-it { font-family: 'Fraunces', serif; font-style: italic; }
    .syne     { font-family: 'Syne', sans-serif; }

    .text-sm    { font-size: 0.875rem; }
    .text-xs    { font-size: 0.75rem; }
    .text-muted { color: var(--ink-4); }
    .text-soft  { color: var(--ink-3); }
    .text-blue  { color: var(--blue); }
    .text-green { color: var(--green); }
    .text-gold  { color: #D97706; }

    .fw-500 { font-weight: 500; }
    .fw-600 { font-weight: 600; }
    .fw-700 { font-weight: 700; }

    .flex         { display: flex; }
    .flex-center  { display: flex; align-items: center; justify-content: center; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }

    .divider { height: 1px; background: var(--line); margin: 24px 0; }
    .stars   { color: #FBBF24; letter-spacing: -1px; }

    /* ════════════════════════════════════════
       ANIMATIONS GLOBALES
    ════════════════════════════════════════ */
    @keyframes fadeUp  { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }

    .afu { animation: fadeUp 0.6s var(--ease) forwards; }
    .d1  { animation-delay: 0.08s; opacity: 0; }
    .d2  { animation-delay: 0.18s; opacity: 0; }
    .d3  { animation-delay: 0.28s; opacity: 0; }
    .d4  { animation-delay: 0.38s; opacity: 0; }
    .d5  { animation-delay: 0.48s; opacity: 0; }

    /* ════════════════════════════════════════
       EN-TÊTES DE SECTION COMMUNS
    ════════════════════════════════════════ */
    .section-eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.8px;
      color: var(--blue); margin-bottom: 12px;
    }
    .section-eyebrow-bar { width: 24px; height: 2px; background: var(--green); border-radius: 2px; }
    .section-h2 {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.9rem, 3.4vw, 2.8rem);
      color: var(--ink); line-height: 1.18;
      letter-spacing: -0.5px; font-weight: 400;
    }
    .section-h2 em { font-style: italic; color: var(--green); }

    /* ════════════════════════════════════════
       RESPONSIVE GLOBAL
    ════════════════════════════════════════ */
    @media (max-width: 768px) {
      .navbar-nav,
      .navbar-actions { display: none; }
      .bottom-nav     { display: block; }
      .page-content         { padding-bottom: 78px; }
      .page-content-flush   { padding-bottom: 78px; }
      .container  { padding: 0 18px; }
      .section    { padding: 60px 0; }
      .navbar     { padding: 0 20px; }
    }
    @media (max-width: 480px) {
      .container { padding: 0 14px; }
    }
    @media (max-width: 1020px) {
      .footer-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .footer-grid { grid-template-columns: 1fr; }
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body x-data="{}">

  {% include 'includes/nav.html' %}

  <main class="{% block main_class %}page-content{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {% include 'includes/footer.html' %}

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ── Service Worker ── */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/pharmap/sw.js').catch(() => {});
    }
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
